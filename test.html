<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="images/logo.png">
  <title>Dulce Beba - Carta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #7FAFA8;
      --primary-dark: #6fa39c;
      --accent: #e8895e;
      --bg: #f5f5f0;
      --card: #ffffff;
      --text: #3a3a3a;
      --text-light: #6b6b6b;
      --border: #dde8e7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 18px;
    }

    /* ── HEADER ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 14px 20px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.18);
      transition: padding 0.3s ease;
    }

    .header.small { padding: 8px 20px; }

    .logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: width 0.3s ease, height 0.3s ease;
    }

    .header.small .logo-wrap { width: 50px; height: 50px; }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-fallback { font-size: 2rem; }

    .header-text { color: white; transition: opacity 0.3s ease; }
    .header.small .header-text { display: none; }

    .header-text h1 { font-size: 1.6rem; font-weight: 700; line-height: 1.2; }
    .header-text p  { font-size: 1rem; opacity: 0.88; }

    /* ── FILTER BAR ── */
    .filter-bar {
      position: sticky;
      top: 100px;
      z-index: 900;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      transition: top 0.3s ease;
    }

    .header.small ~ .filter-bar { top: 66px; }

    .filters {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar { display: none; }

    .filter-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 50px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 52px;
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(127,175,168,0.4);
      transform: translateY(-1px);
    }

    .filter-emoji { font-size: 1.2rem; }

    /* ── MAIN ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 16px 100px;
    }

    .cat-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .cat-heading .cat-emoji { font-size: 2rem; }
    .cat-heading h2 { font-size: 1.6rem; font-weight: 700; }

    /* ── GRID ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(127,175,168,0.15);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(127,175,168,0.28);
    }

    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #e8efee;
    }

    .card-img-placeholder {
      width: 100%;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef4f3;
      font-size: 3.5rem;
    }

    .card-body {
      padding: 18px;
      text-align: center;
    }

    .card-name {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 1rem;
      color: var(--text-light);
      line-height: 1.5;
      margin-bottom: 10px;
      min-height: 1.5em;
    }

    .card-price {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
    }

    /* ── STATES ── */
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 16px;
      text-align: center;
    }

    .state-box .state-icon { font-size: 3.5rem; }

    .state-box p {
      font-size: 1.2rem;
      color: var(--text-light);
      max-width: 300px;
    }

    .state-box .state-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
    }

    .spinner {
      width: 54px;
      height: 54px;
      border: 5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .retry-btn {
      padding: 14px 32px;
      border-radius: 50px;
      border: none;
      background: var(--primary);
      color: white;
      font-family: 'Poppins', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(127,175,168,0.4);
    }

    .item-count {
      text-align: center;
      margin-top: 32px;
      font-size: 1rem;
      color: var(--text-light);
    }

    /* ── FLOATING BUTTONS ── */
    .floating-buttons {
      position: fixed;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }

    .fab {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0,0,0,0.22);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }

    .fab:hover {
      transform: translateY(-3px) scale(1.06);
    }

    .fab-top {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      opacity: 0;
      visibility: hidden;
      transform: translateY(12px) scale(0.9);
      transition: opacity 0.3s, visibility 0.3s, transform 0.3s;
    }

    .fab-top.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .fab-top:hover { transform: translateY(-3px) scale(1.06); }

    .fab-wa {
      background: #25D366;
      box-shadow: 0 6px 20px rgba(37,211,102,0.42);
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      body { font-size: 17px; }
      .grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .card-img, .card-img-placeholder { height: 150px; }
      .card-body { padding: 12px; }
      .card-name { font-size: 1rem; }
      .card-price { font-size: 1.3rem; }
      .filter-btn { padding: 10px 16px; font-size: 0.95rem; min-height: 46px; }
    }

    @media (max-width: 380px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="header" id="header">
  <div class="logo-wrap">
    <img src="logo (1).png" alt="Dulce Beba" id="logo-img"
      onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block'">
    <span class="logo-fallback" id="logo-fallback" style="display:none">☕</span>
  </div>
  <div class="header-text">
    <h1>Dulce Beba</h1>
    <p>Nuestra carta</p>
  </div>
</header>

<div class="filter-bar" id="filterBar">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all" onclick="setFilter(this)">
      <span class="filter-emoji">🩵</span> Todo
    </button>
    <button class="filter-btn" data-cat="bebidas_calientes" onclick="setFilter(this)">
      <span class="filter-emoji">☕</span> Bebidas calientes
    </button>
    <button class="filter-btn" data-cat="bebidas_frias" onclick="setFilter(this)">
      <span class="filter-emoji">🍹</span> Bebidas frías
    </button>
    <button class="filter-btn" data-cat="dulces" onclick="setFilter(this)">
      <span class="filter-emoji">🍪</span> Dulce
    </button>
    <button class="filter-btn" data-cat="salados" onclick="setFilter(this)">
      <span class="filter-emoji">🥪</span> Salado
    </button>
    <button class="filter-btn" data-cat="tortas" onclick="setFilter(this)">
      <span class="filter-emoji">🍰</span> Tortas
    </button>
    <button class="filter-btn" data-cat="postres" onclick="setFilter(this)">
      <span class="filter-emoji">🍮</span> Postres
    </button>
    <button class="filter-btn" data-cat="meriendas" onclick="setFilter(this)">
      <span class="filter-emoji">🧁</span> Meriendas
    </button>
    <button class="filter-btn" data-cat="eventos" onclick="setFilter(this)">
      <span class="filter-emoji">⭐</span> Eventos
    </button>
  </div>
</div>

<div class="container">
  <div id="cat-heading" class="cat-heading" style="display:none">
    <span class="cat-emoji" id="cat-emoji"></span>
    <h2 id="cat-title"></h2>
  </div>
  <div id="menu"></div>
</div>

<div class="floating-buttons">
  <button class="fab fab-top" id="scrollTopBtn" aria-label="Volver arriba" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M6 14L12 8L18 14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <a class="fab fab-wa" href="https://wa.me/598095662193" target="_blank" rel="noopener" aria-label="Contactar por WhatsApp">
    <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="white">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
  </a>
</div>

<script>
  const SHEET_URL = "https://docs.google.com/spreadsheets/d/e/1u92Ch5ZnbxGypIERHey8lkau8giOtzSjFyWegdhSHv4/pub?output=csv";
    //"https://docs.google.com/spreadsheets/d/e/1u92Ch5ZnbxGypIERHey81kau8gi0tzSjFyWegdhSHv4/pub?output=csv";
    //"https://docs.google.com/spreadsheets/d/e/2PACX-1vQfvjGjPA_YlkgQs2uyZqp3jHWE0FpPVlSm4iIELBFbP0ycryTnNBLF5yluwnNBhzJEJMTeAEYraAQ0/pub?output=csv";

  const CAT_INFO = {
    all:               { emoji: "🩵", label: "Todo" },
    bebidas_calientes: { emoji: "☕",  label: "Bebidas calientes" },
    bebidas_frias:     { emoji: "🍹", label: "Bebidas frías" },
    dulces:            { emoji: "🍪", label: "Dulce" },
    salados:           { emoji: "🥪", label: "Salado" },
    tortas:            { emoji: "🍰", label: "Tortas" },
    postres:           { emoji: "🍮", label: "Postres" },
    meriendas:         { emoji: "🧁", label: "Meriendas" },
    eventos:           { emoji: "⭐", label: "Eventos" },
  };

  let allItems = [];
  let activeFilter = "all";

  // ── Load data ──
  async function loadData() {
    showLoading();
    try {
      const res = await fetch(SHEET_URL);
      const text = await res.text();
      allItems = text.split(/\r?\n/).map(row => {
        const [id, name, description, price, img, cat] = row.split(",");
        return { id, name, description, price, img, cat };
      }).filter(i => i.id && i.id.trim() !== "");
      render();
    } catch (e) {
      showError();
    }
  }

  // ── Render ──
  function render() {
    const menu = document.getElementById("menu");
    const heading = document.getElementById("cat-heading");
    const catEmoji = document.getElementById("cat-emoji");
    const catTitle = document.getElementById("cat-title");

    const filtered = activeFilter === "all"
      ? allItems
      : allItems.filter(i => i.cat === activeFilter);

    // Category heading
    if (activeFilter !== "all") {
      catEmoji.textContent = CAT_INFO[activeFilter]?.emoji || "";
      catTitle.textContent = CAT_INFO[activeFilter]?.label || "";
      heading.style.display = "flex";
    } else {
      heading.style.display = "none";
    }

    // Empty state
    if (filtered.length === 0) {
      menu.innerHTML = `
        <div class="state-box">
          <span class="state-icon">🔍</span>
          <p class="state-title">Sin productos en esta categoría</p>
        </div>`;
      return;
    }

    // Grid
    const catEmojiFn = (cat) => CAT_INFO[cat]?.emoji || "🍽️";

    menu.innerHTML = `
      <div class="grid">
        ${filtered.map(item => `
          <div class="card">
            ${item.img
              ? `<img class="card-img" src="${item.img}" alt="${item.name || ''}"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">`
              : ""}
            <div class="card-img-placeholder" style="display:${item.img ? 'none' : 'flex'}">
              ${catEmojiFn(item.cat)}
            </div>
            <div class="card-body">
              <div class="card-name">${item.name || ""}</div>
              ${item.description ? `<div class="card-desc">${item.description}</div>` : ""}
              <div class="card-price">$${item.price || ""}</div>
            </div>
          </div>
        `).join("")}
      </div>
      <p class="item-count">${filtered.length} ${filtered.length === 1 ? "producto" : "productos"}</p>`;
  }

  function showLoading() {
    document.getElementById("cat-heading").style.display = "none";
    document.getElementById("menu").innerHTML = `
      <div class="state-box">
        <div class="spinner"></div>
        <p>Cargando carta...</p>
      </div>`;
  }

  function showError() {
    document.getElementById("menu").innerHTML = `
      <div class="state-box">
        <span class="state-icon">😕</span>
        <p class="state-title">No se pudo cargar la carta</p>
        <p>Revisá tu conexión a internet e intentá de nuevo</p>
        <button class="retry-btn" onclick="loadData()">Reintentar</button>
      </div>`;
  }

  // ── Filter ──
  function setFilter(btn) {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.cat;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ── Header shrink on scroll ──
  const header = document.getElementById("header");
  const scrollTopBtn = document.getElementById("scrollTopBtn");

  window.addEventListener("scroll", () => {
    if (window.scrollY > 60) {
      header.classList.add("small");
    } else {
      header.classList.remove("small");
    }
    if (window.scrollY > 250) {
      scrollTopBtn.classList.add("show");
    } else {
      scrollTopBtn.classList.remove("show");
    }
  }, { passive: true });

  loadData();
</script>

</body>
</html>
